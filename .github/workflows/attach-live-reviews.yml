name: Attach live reviews

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach:
    if: ${{ !contains(github.event.head_commit.message, '[skip reviews]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add live reviews loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="reviews-live.js"></script>\n'
          if 'reviews-live.js' not in text:
              marker = '  <script src="script.js"></script>'
              if marker not in text:
                  raise SystemExit('script.js marker not found')
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit website change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Attach live Google reviews [skip reviews]"
          git push
